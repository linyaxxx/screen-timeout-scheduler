name: Publish release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the release files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Verify the prepared Windows package
        working-directory: downloads/${{ github.event.release.tag_name || inputs.tag }}
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "downloads/$RELEASE_TAG/ScreenTimeoutScheduler-$RELEASE_TAG-Windows.zip" \
            "downloads/$RELEASE_TAG/SHA256SUMS.txt" \
            --repo "$GH_REPO" --clobber
